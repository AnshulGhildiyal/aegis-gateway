[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Fault-tolerant LLM gateway with a semantic cache"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.7",
    "httpx>=0.28",
    "pydantic>=2.10",
    "qdrant-client>=1.13",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["aegis", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
